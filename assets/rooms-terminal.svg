<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="title desc">
  <title id="title">Terminal Chat rooms and lounge story</title>
  <desc id="desc">Two terminal chat windows showing Sneha creating a lounge, Ammu joining it, and both users chatting in the shared room.</desc>
  <rect width="960" height="590" rx="18" fill="#f8fafc"/>
  <rect x="1" y="1" width="958" height="588" rx="17" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="28" y="32" width="430" height="490" rx="12" fill="#0f172a"/>
  <rect x="502" y="32" width="430" height="490" rx="12" fill="#172554"/>
  <circle cx="52" cy="58" r="6" fill="#fb7185"/>
  <circle cx="72" cy="58" r="6" fill="#fbbf24"/>
  <circle cx="92" cy="58" r="6" fill="#34d399"/>
  <circle cx="526" cy="58" r="6" fill="#fb7185"/>
  <circle cx="546" cy="58" r="6" fill="#fbbf24"/>
  <circle cx="566" cy="58" r="6" fill="#34d399"/>
  <text x="122" y="64" fill="#94a3b8" font-family="Consolas, monospace" font-size="16">Sneha@terminal</text>
  <text x="596" y="64" fill="#93c5fd" font-family="Consolas, monospace" font-size="16">Ammu@terminal</text>
  <text x="50" y="116" fill="#67e8f9" font-family="Consolas, monospace" font-size="17">[Sneha@general]</text>
  <text x="50" y="154" fill="#f8fafc" font-family="Consolas, monospace" font-size="17">/create lounge</text>
  <text x="50" y="208" fill="#fbbf24" font-family="Consolas, monospace" font-size="17">created and joined lounge</text>
  <text x="50" y="278" fill="#67e8f9" font-family="Consolas, monospace" font-size="17">[Sneha@lounge]</text>
  <text x="50" y="316" fill="#f8fafc" font-family="Consolas, monospace" font-size="17">Welcome to our room!</text>
  <text x="50" y="386" fill="#a7f3d0" font-family="Consolas, monospace" font-size="17">[Ammu@lounge]</text>
  <text x="50" y="424" fill="#f8fafc" font-family="Consolas, monospace" font-size="17">Hi Sneha, I found it.</text>
  <text x="524" y="116" fill="#93c5fd" font-family="Consolas, monospace" font-size="17">[Ammu@general]</text>
  <text x="524" y="154" fill="#f8fafc" font-family="Consolas, monospace" font-size="17">/rooms</text>
  <text x="524" y="208" fill="#c4b5fd" font-family="Consolas, monospace" font-size="17">available rooms:</text>
  <text x="524" y="246" fill="#a7f3d0" font-family="Consolas, monospace" font-size="17">* general</text>
  <text x="524" y="284" fill="#a7f3d0" font-family="Consolas, monospace" font-size="17">* lounge</text>
  <text x="524" y="354" fill="#93c5fd" font-family="Consolas, monospace" font-size="17">[Ammu@general]</text>
  <text x="524" y="392" fill="#f8fafc" font-family="Consolas, monospace" font-size="17">/join lounge</text>
  <text x="524" y="446" fill="#34d399" font-family="Consolas, monospace" font-size="17">joined lounge</text>
  <text x="50" y="488" fill="#64748b" font-family="Consolas, monospace" font-size="15">shared room history</text>
  <text x="524" y="488" fill="#93c5fd" font-family="Consolas, monospace" font-size="15">rooms are one command away</text>
</svg>
